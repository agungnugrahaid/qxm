apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: qoe
    user: qoe
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      database: qoe
      sslmode: "disable"
      postgresVersion: 1600
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
