auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# The image's bundled default config (no limits_config at all) requires
# strictly increasing timestamps per stream with zero tolerance -- not a
# rolling time window, just "reject anything at or before the last
# successfully-ingested entry for this exact label set." Confirmed the
# hard way: nearly every container-log push got rejected with "entry too
# far behind" even though Promtail was actively reading and forwarding
# logs correctly. unordered_writes fixes that; reject_old_samples_max_age
# is a generous backstop in case a router (or this stack) has a real
# clock/delivery gap.
limits_config:
  unordered_writes: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 336h  # 14 days -- these are noisy operational logs
                          # (e.g. routine PPPoE auth failures from isolated
                          # non-paying customers), not audit history like the
                          # config snapshots' 90-day retention.

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
