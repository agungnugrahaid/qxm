# Sibling stack for traffic-flow collection -- see FLOW_COLLECTION_PLAN.md.
#
#   docker compose -f docker-compose.flow.yml up -d
#   docker compose -f docker-compose.flow.yml logs -f flow-collector
#
# Own project name so it never treats the main stack's containers as orphans
# (a stray --remove-orphans here must not touch the QXM containers). Joins the
# existing qxm_default network so ClickHouse is reachable from Grafana by name.
name: qxmflow

services:
  # goflow2 (IPFIX decoder) + inserter in one container: goflow2 JSON stdout is
  # piped into the inserter, which batch-writes to ClickHouse. Publishes the
  # IPFIX port the MikroTik /ip traffic-flow targets point at.
  flow-collector:
    build:
      context: ./flow
      dockerfile: Dockerfile.inserter
    image: qxm-flow-collector
    container_name: qxm-flow-collector
    environment:
      CH_HOST: clickhouse
      CH_USER: ${CH_USER:-flow}
      CH_PASS: ${CH_PASS:-flowpass}
      CH_DB: flow
    ports:
      - "4739:4739/udp"   # IPFIX target for MikroTik /ip traffic-flow. Same
                          # direct-publish pattern as promtail's 1514/udp syslog.
    depends_on:
      - clickhouse
    restart: unless-stopped

  # Keeps flow.exporter_map (attribution) in step with Postgres: reads
  # router_flow_exporters -> routers -> customers, expands CIDRs, rewrites the
  # map, and logs any exporter IP seen in flows but not yet attributed. Also runs
  # scan_abuse() each cycle: flags internal clients with an abnormal connection /
  # packet rate (the conntrack-exhaustion pattern) into flow_abuse_events and,
  # if WEBHOOK_URL is set, alerts. See FLOW_COLLECTION_PLAN.md.
  flow-sync:
    build:
      context: ./flow
      dockerfile: Dockerfile.sync
    image: qxm-flow-sync
    container_name: qxm-flow-sync
    environment:
      DATABASE_URL: postgresql://qoe:${DB_PASSWORD:-changeme}@timescaledb:5432/qoe
      CH_HOST: clickhouse
      CH_USER: ${CH_USER:-flow}
      CH_PASS: ${CH_PASS:-flowpass}
      CH_DB: flow
      SYNC_INTERVAL: ${FLOW_SYNC_INTERVAL:-300}
      # Abuse detection: empty WEBHOOK_URL = detect + persist only (no alert).
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      ABUSE_WINDOW_MIN: ${ABUSE_WINDOW_MIN:-10}
      ABUSE_FLOOR_CONN_RATE: ${ABUSE_FLOOR_CONN_RATE:-200}
      ABUSE_MULTIPLE_K: ${ABUSE_MULTIPLE_K:-10}
    depends_on:
      - clickhouse
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: qxm-clickhouse
    environment:
      CLICKHOUSE_DB: flow
      CLICKHOUSE_USER: ${CH_USER:-flow}
      CLICKHOUSE_PASSWORD: ${CH_PASS:-flowpass}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    # No host port publish -- reached internally by Grafana + the inserter on
    # qxm_default (clickhouse:8123 HTTP / :9000 native).
    restart: unless-stopped

volumes:
  clickhouse-data:

networks:
  default:
    name: qxm_default
    external: true
