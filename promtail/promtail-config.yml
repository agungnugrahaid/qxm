server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # MikroTik syslog is handled by the separate syslog-forwarder service
  # (UDP -> Loki push directly), not Promtail's syslog scrape target --
  # see docker-compose.yml for why.

  # Your own stack's container logs (ingestion-api, collector, etc.)
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # docker_sd_configs has no static `labels:` block (unlike syslog
      # above) -- without this, entries only ever get a `container`
      # label, never `job`, so a `{job="docker_containers"}` query (the
      # one documented in LOGGING_AND_ALERTS.md) silently returns nothing.
      - target_label: job
        replacement: docker_containers
