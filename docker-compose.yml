version: "3.8"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: qoe
      POSTGRES_USER: qoe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    # No host port published — only reachable from other containers on this
    # stack's internal network. Use Adminer (behind Caddy) if you need a
    # human-facing view.
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qoe"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    depends_on:
      - timescaledb
    restart: unless-stopped

  ingestion-api:
    build: ./ingestion-api
    environment:
      DATABASE_URL: postgresql://qoe:${DB_PASSWORD:-changeme}@timescaledb:5432/qoe
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  collector:
    build: ./collector
    environment:
      DATABASE_URL: postgresql://qoe:${DB_PASSWORD:-changeme}@timescaledb:5432/qoe
    volumes:
      - ./collector/controllers.yaml:/app/controllers.yaml:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  admin-ui:
    build:
      context: .
      dockerfile: admin-ui/Dockerfile
    environment:
      DATABASE_URL: postgresql://qoe:${DB_PASSWORD:-changeme}@timescaledb:5432/qoe
      INGEST_BASE_URL: ${INGEST_BASE_URL:-https://monitor.yourisp.com}
      SFTP_HOST: ${SFTP_HOST:-monitor.yourisp.com}
      SFTP_PORT: ${SFTP_PORT:-2222}
      SFTP_USER: configupload
      SFTP_PASSWORD: ${SFTP_PASSWORD:-changeme}
      SYSLOG_HOST: ${SYSLOG_HOST:-monitor.yourisp.com}
      SYSLOG_PORT: ${SYSLOG_PORT:-1514}
      SYSLOG_IP: ${SYSLOG_IP:-}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-https://grafana.yourisp.com}
      # ClickHouse (flow stack) -- for the report's traffic-composition panels.
      CH_USER: ${CH_USER:-flow}
      CH_PASS: ${CH_PASS:-flowpass}
      # Traffic-flow (IPFIX) export target the deploy step points routers at;
      # falls back to SYSLOG_HOST (same VM) when unset. See .env.example.
      FLOW_COLLECTOR_HOST: ${FLOW_COLLECTOR_HOST:-}
      FLOW_COLLECTOR_PORT: ${FLOW_COLLECTOR_PORT:-4739}
      FLOW_CACHE_ENTRIES: ${FLOW_CACHE_ENTRIES:-512k}
      SFTP_ALLOWED_CIDRS: ${SFTP_ALLOWED_CIDRS:-}
      RADIUS_SERVER_1_SECRET: ${RADIUS_SERVER_1_SECRET:-changeme}
      RADIUS_SERVER_2_SECRET: ${RADIUS_SERVER_2_SECRET:-changeme}
      # Fleet-standard RouterOS API login, pre-filled in the Add Router form.
      ROUTER_API_DEFAULT_USER: ${ROUTER_API_DEFAULT_USER:-}
      ROUTER_API_DEFAULT_PASSWORD: ${ROUTER_API_DEFAULT_PASSWORD:-}
      # App-level login. Empty password = logins refused (fail closed).
      ADMIN_UI_USER: ${ADMIN_UI_USER:-admin}
      ADMIN_UI_PASSWORD: ${ADMIN_UI_PASSWORD:-}
      ADMIN_UI_SESSION_SECRET: ${ADMIN_UI_SESSION_SECRET:-}
      ADMIN_UI_SESSION_HOURS: ${ADMIN_UI_SESSION_HOURS:-8}
    volumes:
      # Read-only: source template for generating customer-locked
      # dashboard clones (see dashboard_share.py). Generated dashboards
      # are pushed to Grafana via its API, not written back to this
      # folder, so admin-ui never needs write access here.
      - ./grafana/provisioning/dashboards:/grafana-dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  sftp:
    image: atmoz/sftp
    environment:
      SFTP_USERS: configupload:${SFTP_PASSWORD:-changeme}:::upload
    volumes:
      # Mounted at the chroot root, not directly at "upload" -- atmoz/sftp's
      # own entrypoint creates + chowns the writable "upload" subdirectory
      # on startup, but only if we don't pre-empt that path with a volume
      # mount (which would otherwise land it root-owned, unwritable by the
      # sftp user).
      - sftp_uploads:/home/configupload
    ports:
      - "2222:22"   # Caddy can't proxy raw SFTP -- same reasoning as promtail's 1514/udp
    restart: unless-stopped

  config-snapshot-watcher:
    build: ./config-snapshot-watcher
    environment:
      DATABASE_URL: postgresql://qoe:${DB_PASSWORD:-changeme}@timescaledb:5432/qoe
    volumes:
      - sftp_uploads:/uploads
    depends_on:
      timescaledb:
        condition: service_healthy
      sftp:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.6
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.6
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  syslog-forwarder:
    build: ./syslog-forwarder
    ports:
      - "1514:1514/udp"   # MikroTik remote syslog target. Not handled by Promtail's
                          # own syslog scrape target: that requires RFC 6587
                          # octet-counting framing even over UDP, which RouterOS's
                          # plain BSD-syslog UDP sender doesn't do, so real packets
                          # were silently dropped. This is a minimal direct
                          # UDP -> Loki push forwarder instead.
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "true"
      # Public URL Grafana is served at -- so it emits correct absolute
      # links (share, redirects). Matches the Caddy vhost + GRAFANA_PUBLIC_URL.
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-https://grafana.yourisp.com}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}   # used by datasources.yml provisioning
      # PNG rendering for the customer PDF reports (see reporting/) --
      # Grafana OSS has no built-in PDF export, so panels are rendered to
      # PNG via the renderer service and assembled into PDFs ourselves.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      # Grafana refuses to start the rendering service with the default
      # token in production mode -- must match the renderer's AUTH_TOKEN.
      GF_RENDERING_RENDERER_TOKEN: ${RENDERER_TOKEN:-changeme}
      # Traffic-flow analytics live in ClickHouse (docker-compose.flow.yml);
      # this plugin + datasource surface them alongside the QoE dashboards.
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CH_USER: ${CH_USER:-flow}
      CH_PASS: ${CH_PASS:-flowpass}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - timescaledb
      - loki
    restart: unless-stopped

  # Headless browser that turns Grafana panels into PNGs (used by the
  # customer PDF reports). Internal-only -- nothing publishes its port.
  renderer:
    image: grafana/grafana-image-renderer:latest
    environment:
      AUTH_TOKEN: ${RENDERER_TOKEN:-changeme}
    restart: unless-stopped

  # Monthly customer QoE PDF emails (see reporting/reporter.py). The
  # on-demand equivalent lives in admin-ui ("Download PDF report").
  # Needs real SMTP_* values in .env before it can actually send.
  reporter:
    build:
      context: .
      dockerfile: reporting/Dockerfile
    environment:
      DATABASE_URL: postgresql://qoe:${DB_PASSWORD:-changeme}@timescaledb:5432/qoe
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-https://grafana.yourisp.com}
      # ClickHouse (flow stack) -- for the report's traffic-composition panels.
      CH_USER: ${CH_USER:-flow}
      CH_PASS: ${CH_PASS:-flowpass}
      SMTP_HOST: ${SMTP_HOST:-changeme}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-changeme}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-changeme}
      REPORT_FROM_ADDRESS: ${REPORT_FROM_ADDRESS:-reports@yourisp.com}
    volumes:
      # Source template for the customer-locked dashboard clones
      # (dashboard_share.py) -- read-only, same mount admin-ui uses.
      - ./grafana/provisioning/dashboards:/grafana-dashboards:ro
      # Remembers which month's run already happened, so a container
      # restart on the 1st doesn't re-email everyone.
      - reporter_state:/state
    depends_on:
      timescaledb:
        condition: service_healthy
      grafana:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ingestion-api
      - admin-ui
      - grafana
      - adminer
    restart: unless-stopped

  pg-backup:
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_DB: qoe
      POSTGRES_USER: qoe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - pg_backups:/backups
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  watchdog:
    build: ./watchdog
    environment:
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      # The incident detector runs here too: it is the same "is anything
      # broken" job, and the collector-freshness alert this stack has been
      # missing belongs in the same place.
      DATABASE_URL: postgresql://qoe:${DB_PASSWORD:-changeme}@timescaledb:5432/qoe
    depends_on:
      - ingestion-api
      - admin-ui
      - timescaledb
    restart: unless-stopped

volumes:
  timescale_data:
  grafana_data:
  loki_data:
  caddy_data:
  caddy_config:
  pg_backups:
  sftp_uploads:
  reporter_state:
