<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QoE Fleet Admin</title>
  
  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/static/simple-datatables.css">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="/static/simple-datatables.js"></script>
</head>
<body class="{% block bodyclass %}{% endblock %}">
  
  <!-- Mobile Header -->
  <div class="mobile-nav-bar">
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <i data-lucide="activity" style="color:var(--action-blue)"></i>
      <span style="font-weight:700; letter-spacing:0.05em;">QoE FLEET</span>
    </div>
    <button class="mobile-nav-toggle" onclick="toggleMobileSidebar()" aria-label="Toggle Navigation">
      <i data-lucide="menu"></i>
    </button>
  </div>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <i data-lucide="activity" style="color:var(--action-blue); width:24px; height:24px;"></i>
        <span class="logo-text">QoE FLEET</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="sidebar-link {% if request.url.path == '/' or '/routers' in request.url.path %}active{% endif %}">
          <i data-lucide="router" style="width:18px; height:18px;"></i>
          <span>Routers</span>
        </a>
        <a href="/sites" class="sidebar-link {% if '/sites' in request.url.path %}active{% endif %}">
          <i data-lucide="map-pin" style="width:18px; height:18px;"></i>
          <span>Sites</span>
        </a>
        <a href="/customers" class="sidebar-link {% if '/customers' in request.url.path %}active{% endif %}">
          <i data-lucide="users" style="width:18px; height:18px;"></i>
          <span>Customers</span>
        </a>
      </nav>
      <div style="padding: 1rem; font-size: 0.75rem; color: rgba(255,255,255,0.4); border-top: 1px solid rgba(255,255,255,0.1);">
        Lumina Console v1.0
      </div>
    </aside>

    <!-- Main Content Panel -->
    <main class="main-content">
      <header class="top-header">
        <div class="page-title-area">
          <div style="display:flex; align-items:center; gap:0.5rem; font-size:0.8rem; color:var(--on-surface-variant); margin-bottom:0.25rem;">
            <span>Console</span> &raquo; <span>{% block section_name %}System{% endblock %}</span>
          </div>
          <h1 style="margin: 0; font-size: 1.5rem; color: var(--primary);">{% block page_title %}Dashboard{% endblock %}</h1>
        </div>
        <div style="display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; color:var(--on-surface-variant)">
          <i data-lucide="shield-check" style="width:16px; height:16px; color:var(--success)"></i>
          <span>Secure Session</span>
        </div>
      </header>

      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Responsive Mobile Sidebar Toggle
    function toggleMobileSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      sidebar.classList.toggle('open');
    }
  </script>
</body>
</html>
