<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QoE Fleet Admin</title>
  <style>
    body { font-family: -apple-system, Arial, sans-serif; max-width: 960px; margin: 2rem auto; color: #1f2937; }
    nav a { margin-right: 1rem; color: #1d4ed8; text-decoration: none; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; }
    th { color: #6b7280; text-transform: uppercase; font-size: 0.75rem; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge.online { background: #dcfce7; color: #166534; }
    .badge.offline { background: #fee2e2; color: #991b1b; }
    .btn { display: inline-block; padding: 0.35rem 0.7rem; border-radius: 6px; border: 1px solid #d1d5db; background: #f9fafb; color: #111827; text-decoration: none; font-size: 0.85rem; cursor: pointer; }
    .btn.primary { background: #1d4ed8; color: white; border-color: #1d4ed8; }
    form.inline { display: inline; }
    .field { margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.85rem; color: #374151; margin-bottom: 0.25rem; }
    input, select { width: 100%; padding: 0.4rem 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
    .result-ok { color: #166534; }
    .result-fail { color: #991b1b; }
    .diff { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 0.75rem; overflow-x: auto; font-size: 0.8rem; line-height: 1.4; }
    .diff-line { display: block; white-space: pre; font-family: ui-monospace, Menlo, monospace; }
    .diff-add { background: #dcfce7; color: #166534; }
    .diff-del { background: #fee2e2; color: #991b1b; }
    .diff-hunk { color: #6b7280; font-weight: 600; }
    .line-no { display: inline-block; width: 3.5rem; text-align: right; margin-right: 0.75rem; color: #9ca3af; user-select: none; }
    /* Wide tables (Sites/Routers with datatables) benefit from more room */
    body.wide { max-width: 1400px; }
    /* Keep the datatable search/paging chrome aligned with our styling */
    .datatable-input { width: auto; }
    .datatable-selector { width: auto; }
  </style>
  <link rel="stylesheet" href="/static/simple-datatables.css">
  <script src="/static/simple-datatables.js"></script>
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <nav>
    <a href="/">Routers</a>
    <a href="/sites">Sites</a>
    <a href="/customers">Customers</a>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
