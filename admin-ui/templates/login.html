<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — QXM Console</title>
  {% if logo_exists %}
  <link rel="icon" type="image/png" href="/static/logo.png">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dashboard.css?v=2">
  <style>
    .login-wrap {
      margin: auto;
      width: 100%;
      max-width: 380px;
      padding: 1rem;
    }
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .login-brand .logo-text {
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      color: var(--primary);
    }
    .login-brand .logo-subtitle {
      font-size: 0.62rem;
      color: var(--on-surface-variant);
      margin-top: 0.1rem;
      white-space: nowrap;
    }
    .login-card {
      background-color: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.05);
    }
    .login-error {
      background-color: #fee2e2;
      border-left: 4px solid var(--terracotta);
      color: #7f1d1d;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
    }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--on-surface-variant);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      {% if logo_exists %}
      <img src="/static/logo.png" alt="QXM Console" style="height:36px; width:auto;">
      {% endif %}
      <div>
        <div class="logo-text">QXM CONSOLE</div>
        <div class="logo-subtitle">Quality eXperience Monitoring</div>
      </div>
    </div>

    <div class="login-card">
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn primary" style="width:100%; height:40px;">Sign in</button>
      </form>
    </div>

    <div class="login-footer">QXM Console v1.0</div>
  </div>
</body>
</html>
