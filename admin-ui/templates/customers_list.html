{% extends "base.html" %}
{% block section_name %}Admin{% endblock %}
{% block page_title %}Customers{% endblock %}

{% block content %}
  <!-- Customers List Card -->
  <div class="card">
    <table id="customers-table">
      <thead>
        <tr>
          <th style="width: 15%;">Name</th>
          <th style="width: 15%;">Address</th>
          <th style="width: 40%;">Report email</th>
          <th style="width: 30%;">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for c in customers %}
        <tr>
          <td style="font-weight: 600; color: var(--primary);">{{ c.name }}</td>
          <td>{{ c.address or "—" }}</td>
          <td>
            <form class="inline" method="post" action="/customers/{{ c.id }}/report-email" style="display:flex; gap:0.4rem; max-width: 320px;">
              <input name="report_email" type="email" placeholder="not emailed" value="{{ c.report_email or '' }}" style="width: 14rem; padding: 0.35rem 0.5rem; font-size:0.85rem;">
              <button class="btn" type="submit" style="padding: 0.35rem 0.75rem; font-size:0.85rem;">
                <i data-lucide="check" style="width:14px; height:14px; color:var(--success);"></i>
                Save
              </button>
            </form>
          </td>
          <td>
            <div class="inline-actions">
              <form class="inline" method="post" action="/customers/{{ c.id }}/share-dashboard">
                <button class="btn" type="submit" title="Generate Grafana shareable link">
                  <i data-lucide="share-2" style="width:14px; height:14px; color:var(--secondary);"></i>
                  <span class="btn-text">Share</span>
                </button>
              </form>
              <a class="btn" href="/customers/{{ c.id }}/report" title="Download monthly network quality PDF report">
                <i data-lucide="file-text" style="width:14px; height:14px;"></i>
                <span class="btn-text">PDF Report</span>
              </a>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <!-- Add Customer Card -->
  <div class="card" style="max-width: 600px;">
    <h2 style="font-size: 1.25rem; border-bottom: 1px solid var(--outline-variant); padding-bottom: 0.5rem; margin-bottom: 1rem;">
      <i data-lucide="user-plus" style="width:18px; height:18px; display:inline-block; vertical-align:middle; margin-right:0.25rem; color:var(--secondary);"></i>
      Add customer
    </h2>
    <form method="post" action="/customers/new">
      <div class="field">
        <label>Name</label>
        <input name="name" required placeholder="e.g. Acme Corp">
      </div>
      <div class="field">
        <label>Address</label>
        <input name="address" placeholder="e.g. 123 Network Way">
      </div>
      <button class="btn primary" type="submit">
        <i data-lucide="plus" style="width:16px; height:16px;"></i>
        Add Customer
      </button>
    </form>
  </div>
{% endblock %}
